name: ⚗️Check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: release
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  crosscompile:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # タグ情報を取得するために全履歴を取得
      # build.sh は host の ~/go/pkg/mod・~/.cache/go-build を Docker にマウントする
      - name: Cache Go modules & build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-crosscompile-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-crosscompile-
      - name: build
        run: make build

  build-steam:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # タグ情報を取得するために全履歴を取得
      # build_steam.sh は host の ~/go/pkg/mod・~/.cache/go-build を Docker にマウントする
      - name: Cache Go modules & build cache (build_steam.sh の docker マウント用)
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-build-steam-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-build-steam-
      - name: build-steam
        run: make build-steam

  test:
    runs-on: ubuntu-latest
    permissions:
      # octocov 用の設定
      # PRにコメントする
      pull-requests: write
      # 実行時間取得
      contents: read
      # 前のレポートを取得する
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-with-x
      - name: test
        # カバレッジは make test が coverage.out に出力し octocov が読む。
        # テストの別実行を挟まないことで xvfb セッションを1本に保つ
        run: make test
      - uses: k1LoW/octocov-action@v1

  race-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-with-x
      - name: Flaky check
        # race検出付きで実行し、データ競合を検出する。
        run: make test RACE=-race

  grill-branch:
    # ブランチで変更したテストを反復実行し、フレーキーテストをマージ前に炙り出す。
    # 変更されたテストが無ければ何もせず成功する。main への push では diff が
    # 常に空なので、PR のときだけ動かして全履歴 fetch を省く
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # origin/main との diff に履歴が要る
      - uses: ./.github/actions/setup-go-with-x
      - name: grill changed tests
        run: make grill-branch

  bench:
    # main と PR のベンチを並列レグで走らせ、それぞれ結果を artifact に上げる。base と PR を別ジョブに
    # 分けることで直列実行の待ち時間が半分になる。count=6 で実行時間が伸びるぶん効く。
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # 片側が落ちても他方は完走させる。compare 側で base 欠落を PR のみ表示へ倒すため
      fail-fast: false
      matrix:
        include:
          - side: pr
            ref: ${{ github.event.pull_request.head.sha }}
          - side: base
            ref: ${{ github.event.pull_request.base.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
      - uses: ./.github/actions/setup-go-with-x
      - name: run benchmark (${{ matrix.side }})
        # GOFLAGS で go test へ -count=6 を渡す。環境変数なので base 側の Makefile を変えずに効く。
        # benchstat は6サンプル以上で信頼区間と p 値を出せる。各レグは自分の checkout で top-level 実行
        # なので、直列版で必要だった -C 由来の "make: Entering directory" 対策は要らない。
        env:
          GOFLAGS: -count=6
        run: make bench > bench-${{ matrix.side }}.txt
      - name: record commit
        # ベンチが落ちても実行コミットは記録し、compare 側の表示を保つ
        if: always()
        run: git rev-parse --short HEAD > bench-${{ matrix.side }}.sha
      - uses: actions/upload-artifact@v4
        # 途中失敗でも sha と部分結果を上げ、内容の検証は compare 側に委ねる
        if: always()
        with:
          name: bench-${{ matrix.side }}
          path: bench-${{ matrix.side }}.*
          if-no-files-found: ignore

  bench-compare:
    # 並列ジョブの結果を突き合わせ、sticky コメント表示、sec/op の geomean が2倍以上悪化したら失敗させる。
    needs: bench
    # bench のどちらかが落ちても比較コメントは出す。base 欠落なら PR のみ表示へ倒す
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # sticky コメント投稿用
    steps:
      - uses: actions/checkout@v7 # setup-go と benchstat 用にリポジトリが要る
      - uses: ./.github/actions/setup-go-with-x
      - uses: actions/download-artifact@v4
        with:
          name: bench-pr
          path: .
      - uses: actions/download-artifact@v4
        # base レグが失敗すると artifact が無いことがある。落とさず PR のみ表示へ倒す
        continue-on-error: true
        with:
          name: bench-base
          path: .
      - name: compare
        id: cmp
        run: |
          # 途中でクラッシュしても sticky comment ステップがファイル無しで失敗しないよう保証する
          touch cmp.md
          bad=
          # 実際にベンチを実行した commit を表示する。sha は各レグが artifact に含める
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          PR_SHA=$(cat bench-pr.sha 2>/dev/null || echo unknown)
          BASE_SHA=$(cat bench-base.sha 2>/dev/null || echo unknown)
          SHA_LINE="> 実行コミット: base [\`${BASE_SHA}\`](${REPO_URL}/commit/${BASE_SHA}) → PR [\`${PR_SHA}\`](${REPO_URL}/commit/${PR_SHA})"
          # benchstat -format csv の geomean 行は次の形:
          #   ,sec/op,CI,sec/op,CI,vs base,P        ← metric ヘッダ行（$1="" $2=metric）
          #   geomean,<base値>,,<pr値>,,+200.00%,    ← $1=geomean $2=base $4=pr
          # コメントは常に details で畳む。退化を検出したときだけ open で開き見逃さない。
          # summary 内で状態が読めるよう、見出しと退化有無を1行に出す
          if grep -q '^Benchmark' bench-base.txt 2>/dev/null; then
            # sec/op の geomean が2倍以上悪化したパッケージを検出する。
            # 個別ベンチはノイズで簡単に2倍になり誤発火するため、集約値の geomean で判定する。
            # geomean が2倍動くには大半のベンチが劣化する必要がある。
            bad=$(go tool benchstat -format csv bench-base.txt bench-pr.txt 2>/dev/null | awk -F, '
              $1=="" && $2!="" { metric=$2; next }
              $1=="geomean" && metric=="sec/op" && ($2+0==$2) && ($4+0==$4) && $2>0 && $4/$2>=2 {
                printf "- geomean: x%.2f\n", $4/$2 }')
            if [ -n "$bad" ]; then
              open_attr=' open'; summary='⚠️ ベンチ比較 (base vs PR) — 2倍以上の悪化を検出'
            else
              open_attr=''; summary='📊 ベンチ比較 (base vs PR)'
            fi
            # summary 直後と閉じタグ前の空行は details 内の Markdown を描画させるため必須
            { echo "<details${open_attr}><summary>${summary}</summary>";
              echo "";
              echo "$SHA_LINE"; echo '```'; go tool benchstat bench-base.txt bench-pr.txt; echo '```';
              echo ""; echo '</details>'; } > cmp.md
          else
            # base 側にベンチが無い（初回PR・リネーム・base レグ失敗等）場合、 PR のみ表示し比較不可を明示する
            { echo '<details><summary>📊 ベンチ (PR のみ・base と比較不可)</summary>';
              echo "";
              echo "$SHA_LINE";
              echo '> base 側に比較対象のベンチが取得できなかったため、今回は PR の数値のみ表示します。';
              echo '```'; go tool benchstat bench-pr.txt; echo '```';
              echo ""; echo '</details>'; } > cmp.md
          fi
          # CI ログで生成した Markdown を確認する
          cat cmp.md
          { echo "bad<<EOF"; echo "$bad"; echo "EOF"; } >> "$GITHUB_OUTPUT"
      - name: sticky comment
        if: always()
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: bench-compare
          path: cmp.md
      - name: gate on catastrophic regression
        if: steps.cmp.outputs.bad != ''
        run: |
          echo "::error::ベンチマークが2倍以上悪化しました。詳細はPRコメント参照"
          exit 1

  check-ui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor-ui/package-lock.json
      - name: install
        run: npm ci --prefix editor-ui
      - name: check-ui
        run: make check-ui

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-with-x
      - name: lint
        run: make toolsinstall lint

  generate-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-with-x
      - name: generate
        run: make generate
      - name: check diff
        run: |
          git status # ジョブが失敗したとき、どこで失敗したか人が確認する用
          test -z "$(git status -s)"

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Get git tag(short)
        id: git-tag
        run: |
          GIT_TAG=$(git rev-parse --short HEAD)
          echo "git-tag=$GIT_TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for release
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          builder: ${{ steps.buildx.outputs.name }}
          target: release
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.git-tag.outputs.git-tag }},ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
