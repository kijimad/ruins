          description: 屋根か壁に覆われているか。覆われないタイルに繋がる領域は屋外とみなす
      description: 囲われの度合いごとの、世界温度の受け方と表示名。受ける温度は anchorTemp + (世界温度 - anchorTemp) * influencePercent / 100
    ShelterInfluencePercent:
      type: integer
      minimum: 0
      maximum: 100
      description: 世界温度を引き寄せる割合。百分率。100 なら世界温度をそのまま受ける
    SiteChoice:
      type: object
      required:
        - id
        - homeWeight
        - shopWeight
        - yardDepth
        - fence
      properties:
        id:
          $ref: '#/components/schemas/SiteType'
        homeWeight:
          $ref: '#/components/schemas/SiteWeight'
        shopWeight:
          $ref: '#/components/schemas/SiteWeight'
        yardDepth:
          $ref: '#/components/schemas/YardDepth'
        fence:
          type: boolean
          description: 敷地を塀で囲うか。街路に面して開く敷地は囲わない
      description: 敷地の類型の、民家と店それぞれで選ばれる重みと前庭の奥行き。行の順に重みを積む
    SiteType:
      type: string
      enum:
        - detached
        - shopfront
        - roadside
      description: 敷地の類型。前庭の深さと外構の出し分けに使う
    SiteWeight:
      type: integer
      format: int32
      minimum: 0
      description: 敷地の類型の選ばれる重み。0 ならその種類の建物では選ばれない
    Skill:
      type: object
      required:
        - id
        - name
        - summary
        - gainedBy
        - effect
        - ability
        - category
      properties:
        id:
          $ref: '#/components/schemas/SkillId'
        name:
          $ref: '#/components/schemas/EntityName'
        summary:
          $ref: '#/components/schemas/EntityDescription'
        gainedBy:
          $ref: '#/components/schemas/EntityDescription'
        effect:
          $ref: '#/components/schemas/EntityDescription'
        ability:
          $ref: '#/components/schemas/AbilityId'
        category:
          $ref: '#/components/schemas/SkillCategoryId'
        proficiencies:
          type: array
          items:
            $ref: '#/components/schemas/SkillProficiency'
      description: スキル。同じカテゴリのスキルは行の順に表示する
    SkillBook:
      type: object
      required:
        - targetSkill
        - requiredLevel
        - maxLevel
      properties:
        targetSkill:
          $ref: '#/components/schemas/SkillId'
        requiredLevel:
          $ref: '#/components/schemas/SkillLevel'
        maxLevel:
          $ref: '#/components/schemas/SkillLevel'
      description: スキル本設定
    SkillCategory:
      type: object
      required:
        - id
        - name
      properties:
        id:
          $ref: '#/components/schemas/SkillCategoryId'
        name:
          $ref: '#/components/schemas/EntityName'
      description: スキルのカテゴリ。行の順に表示する
    SkillCategoryId:
      type: string
      minLength: 1
      maxLength: 50
      pattern: ^[a-z][a-z0-9_]*$
      description: スキルのカテゴリの id
    SkillId:
      type: string
      enum:
        - sword
        - spear
        - fist
        - weight_bearing
        - bow
        - handgun
        - rifle
        - cannon
        - exploration
        - crafting
        - smithing
        - negotiation
        - mechanic
        - sprinting
        - stealth
        - night_vision
        - cold_resist
        - hunger_resist
        - healing
        - heavy_armor
        - fire_resist
        - thunder_resist
        - chill_resist
        - photon_resist
      description: スキルID
    SkillLevel:
      type: integer
      minimum: 0
      maximum: 100
      description: スキルレベル
    SkillProficiency:
      type: object
      required:
        - id
        - perLevel
      properties:
        id:
          $ref: '#/components/schemas/ProficiencyId'
        perLevel:
          $ref: '#/components/schemas/ProficiencyPerLevel'
        resists:
          allOf:
            - $ref: '#/components/schemas/Element'
          description: この倍率が受けるダメージを軽減する攻撃属性。無属性を除く属性それぞれをちょうど1つの倍率が持つ
      description: スキルが左右する熟練の効果倍率
    SpellTurns:
      type: integer
      minimum: 1
      maximum: 100000
      description: 天候のスペルの基準長。ターン
    SpriteDepth:
      type: number
      enum:
        - 0
        - 1
        - 2
        - 3
        - 4
      description: スプライト描画深度
    SpriteKey:
      type: string
      minLength: 1
      maxLength: 100
      pattern: ^[a-z][a-z0-9_]*$
      description: スプライトキー
    SpriteRender:
      type: object
      required:
        - spriteSheetName
        - spriteKey
        - depth
      properties:
        spriteSheetName:
          $ref: '#/components/schemas/SpriteSheetName'
        spriteKey:
          $ref: '#/components/schemas/SpriteKey'
        depth:
          $ref: '#/components/schemas/SpriteDepth'
      description: スプライトレンダー設定
    SpriteSheet:
      type: object
      required:
        - name
        - path
      properties:
        name:
          $ref: '#/components/schemas/EntityName'
        path:
          $ref: '#/components/schemas/ImagePath'
      description: スプライトシート
    SpriteSheetList:
      type: object
      required:
        - data
        - totalCount
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SpriteSheet'
        totalCount:
          type: integer
      description: スプライトシート一覧
    SpriteSheetName:
      type: string
      minLength: 1
      maxLength: 50
      pattern: ^[a-z][a-z0-9_]*$
      description: スプライトシート名
    StageBaseTemp:
      type: integer
      minimum: -100
      maximum: 100
      description: ステージの基本気温。℃
    StageLengthTurns:
      type: integer
      minimum: 1
      maximum: 100000
      description: 1段階の長さ。この経過ターンごとに新鮮→劣化→腐敗と進む。省略すると腐敗しない
    StorageRaw:
      type: object
      required:
        - maxWeight
      properties:
        maxWeight:
          allOf:
            - $ref: '#/components/schemas/Weight'
          description: 収納の最大格納重量
        lootTableId:
          allOf:
            - $ref: '#/components/schemas/EntityID'
          description: 初期アイテムの抽選に使うItemTable名
        lootCount:
          allOf:
            - $ref: '#/components/schemas/Dice'
          description: 初期アイテム数のダイス表記。省略時は1
      description: 収納ローデータ
    Strength:
      type: integer
      minimum: -100
      maximum: 100
      description: 筋力。物理ダメージに影響する
    StuffKind:
      type: string
      enum:
        - furniture
        - loot
        - being
        - decor
        - trap
      description: 配置指示の種別。家具・戦利品・敵・装飾・罠を同じ器で扱う
    TargetGroup:
      type: string
      enum:
        - ENEMY
        - ALLY
        - WEAPON
        - NONE
      description: ターゲットグループ
    TargetNum:
      type: string
      enum:
        - SINGLE
        - ALL
      description: ターゲット数
    Tile:
      type: object
      required:
        - id
        - name
        - description
        - blockPass
        - blockView
        - spriteRender
      properties:
        id:
          $ref: '#/components/schemas/EntityID'
        name:
          $ref: '#/components/schemas/EntityName'
        description:
          $ref: '#/components/schemas/EntityDescription'
        blockPass:
          $ref: '#/components/schemas/BlocksPassage'
        blockView:
          $ref: '#/components/schemas/BlocksView'
        spriteRender:
          $ref: '#/components/schemas/SpriteRender'
        water:
          type: boolean
          description: 水のタイル。上に立つと水中、隣に立つと水辺の気温の補正を受ける
        foliage:
          allOf:
            - $ref: '#/components/schemas/Foliage'
          description: 植生。省くと植生なし
        spawn:
          allOf:
            - $ref: '#/components/schemas/TileSpawn'
          description: マップの計画からこのタイルを生成するときの仕様。省くと計画に置けない
      description: タイル
    TileList:
      type: object
      required:
        - data
        - totalCount
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Tile'
        totalCount:
          type: integer
      description: タイル一覧
    TileSpawn:
      type: object
      required:
        - autotile
      properties:
        tile:
          allOf:
            - $ref: '#/components/schemas/EntityID'
          description: 生成するタイルの id。壁の計画を壁の見た目の別タイルで生成するときに使う。省くと自身
        autotile:
          type: boolean
          description: 周りのタイルを見てオートタイルの添字を計算するか。単一の絵柄のタイルは false
      description: 計画のタイルを実体化する仕様
    TileTempModifier:
      type: integer
      minimum: -50
      maximum: 50
      description: 水や植生がタイルの気温に足す補正。℃
    TimeOfDay:
      type: object
      required:
        - id
        - name
        - tempModifier
        - daylight
        - ambientColor
      properties:
        id:
          $ref: '#/components/schemas/TimeOfDayId'
        name:
          $ref: '#/components/schemas/EntityName'
        tempModifier:
          $ref: '#/components/schemas/TimeOfDayTempModifier'
        daylight:
          $ref: '#/components/schemas/LightLevel'
        ambientColor:
          $ref: '#/components/schemas/AmbientColor'
      description: |-
        時間帯の表示名、世界温度への加算、地上の日照の明るさと環境光の色。
            明るさと色は時間帯の中心の値で、間は隣の時間帯の値と線形に補間する
    TimeOfDayId:
      type: string
      enum:
        - dawn
        - morning
        - noon
        - evening
        - night
        - midnight
      description: 時間帯。1日は夜明けで始まり、この順に巡る
    TimeOfDayTempModifier:
      type: integer
      minimum: -50
      maximum: 50
      description: 時間帯による世界温度への加算。℃
    Tool:
      type: object
      required:
        - categories
        - grade
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/ToolCategory'
        grade:
          $ref: '#/components/schemas/ToolGrade'
      description: 道具の性質。道具の分類とグレードを持つ
    ToolCategory:
      type: string
      enum:
        - prying
        - precision
        - cutting
        - chopping
        - mining
      description: 道具の分類
    ToolCategoryDef:
      type: object
      required:
        - id
      properties:
        id:
          $ref: '#/components/schemas/ToolCategory'
        skill:
          $ref: '#/components/schemas/SkillId'
      description: 道具の分類と、合う道具で壊したとき伸びるスキル。スキルを省くと伸びない
    ToolGrade:
      type: integer
      minimum: 1
      maximum: 3
      description: 道具のグレード。高いほど速く壊し多く得る
    UsableScene:
      type: string
      enum:
        - BATTLE
        - FIELD
        - ANY
      description: 使用可能シーン
    VariantChoice:
      type: object
      required:
        - id
        - weight
      properties:
        id:
          $ref: '#/components/schemas/BuildingVariant'
        weight:
          $ref: '#/components/schemas/EntryWeight'
        damage:
          allOf:
            - $ref: '#/components/schemas/BuildingDamage'
          description: 引いた損傷段階を上書きする。省くと上書きしない
        minClutter:
          allOf:
            - $ref: '#/components/schemas/BuildingClutter'
          description: 散らかり段階をこれ以上に引き上げる。省くと引き上げない
        density:
          allOf:
            - $ref: '#/components/schemas/DensityFactor'
          description: 引いた家具量の倍率を上書きする。省くと上書きしない
      description: 建物の変種の重み
    ViewDistance:
      type: integer
      minimum: 1
      maximum: 100
      description: AI視界距離（タイル単位）
    Vitality:
      type: integer
      minimum: -100
      maximum: 100
      description: 体力。HPに影響する
    WarpNextTriggerRaw:
      type: object
      description: 次階層ワープトリガー
    WarpPrevTriggerRaw:
      type: object
      description: 前階層ワープトリガー
    WaterEffect:
      type: object
      required:
        - id
        - tempModifier
      properties:
        id:
          $ref: '#/components/schemas/WaterExposure'
        tempModifier:
          $ref: '#/components/schemas/TileTempModifier'
      description: 水がタイルの気温に足す補正
    WaterExposure:
      type: string
      enum:
        - nearby
        - submerged
      description: タイルが受ける水の影響
    Wearable:
      type: object
      required:
        - defense
        - equipmentCategory
        - insulationCold
        - insulationHeat
      properties:
        defense:
          $ref: '#/components/schemas/ArmorDefense'
        equipmentCategory:
          $ref: '#/components/schemas/EquipmentCategory'
        insulationCold:
          $ref: '#/components/schemas/InsulationCold'
        insulationHeat:
          $ref: '#/components/schemas/InsulationHeat'
      description: 装備可能設定
    Weather:
      type: object
      required:
        - id
        - name
        - tempModifier
        - visionDelta
        - severity
        - spellTurnsMin
        - spellTurnsMax
        - seasons
      properties:
        id:
          $ref: '#/components/schemas/WeatherId'
        name:
          $ref: '#/components/schemas/EntityName'
        tempModifier:
          $ref: '#/components/schemas/WeatherTempModifier'
        visionDelta:
          $ref: '#/components/schemas/WeatherVisionDelta'
        severity:
          $ref: '#/components/schemas/WeatherSeverity'
        spellTurnsMin:
          $ref: '#/components/schemas/SpellTurns'
        spellTurnsMax:
          $ref: '#/components/schemas/SpellTurns'
        seasons:
          type: array
          items:
            $ref: '#/components/schemas/WeatherSeasonWeight'
      description: 天候。遷移の粘りの距離は行の順でなく Go の WeatherKind の並びに依る
    WeatherId:
      type: string
      enum:
        - clear
        - cloudy
        - rain
        - snow
        - blizzard
        - cold_snap
      description: 天候の種類
    WeatherSeasonWeight:
      type: object
      required:
        - id
        - weight
      properties:
        id:
          $ref: '#/components/schemas/SeasonId'
        weight:
          $ref: '#/components/schemas/EntryWeight'
      description: 季節ごとの天候の出やすさ
    WeatherSeverity:
      type: integer
      minimum: 0
      maximum: 10
      description: 天候の寒さの厳しさ。奥地ほど厳しい天候を厚くし、冬と奥地で長引かせるのに使う
    WeatherTempModifier:
      type: integer
      minimum: -50
      maximum: 50
      description: 天候による世界温度への加算。℃
    WeatherVisionDelta:
      type: integer
      minimum: -100
      maximum: 100
      description: 天候による視程レンジへの加算。タイル。負で狭くなる
    Weight:
      type: string
      pattern: ^[0-9]+(\.[0-9]+)? (mg|g|kg)$
      description: '重量。単位付き文字列で指定する。例: "500 g" "2 kg" "1 mg"'
    YardDepth:
      type: integer
      format: int32
      minimum: 0
      maximum: 10
      description: 入口側に空ける前庭の奥行き。タイル
    Zone:
      type: string
      enum:
        - downtown
        - residential
        - industrial
      description: 市街地の地区
servers:
  - url: http://localhost:8080
    description: Development server
    variables: {}
