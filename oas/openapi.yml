components:
  schemas:
    Abilities:
      type: object
      required:
        - vitality
        - strength
        - sensation
        - dexterity
        - agility
        - defense
      properties:
        vitality:
          $ref: '#/components/schemas/Vitality'
        strength:
          $ref: '#/components/schemas/Strength'
        sensation:
          $ref: '#/components/schemas/Sensation'
        dexterity:
          $ref: '#/components/schemas/Dexterity'
        agility:
          $ref: '#/components/schemas/Agility'
        defense:
          $ref: '#/components/schemas/Defense'
      description: 能力値
    AbilityId:
      type: string
      enum:
        - str
        - sen
        - dex
        - agi
        - vit
        - def
      description: 能力値。スキルの成長の速さと熟練の効果倍率に効く
    Accuracy:
      type: integer
      minimum: 0
      maximum: 100
      description: 命中率。0で必中なし、100で必中
    AccuracyBonus:
      type: integer
      minimum: -100
      maximum: 100
      description: 命中率補正値
    ActionCost:
      type: integer
      minimum: 0
      maximum: 100
      description: 行動コスト
    Agility:
      type: integer
      minimum: -100
      maximum: 100
      description: 敏捷性。行動順に影響する
    AmbientColor:
      type: object
      required:
        - r
        - g
        - b
      properties:
        r:
          $ref: '#/components/schemas/LightLevel'
        g:
          $ref: '#/components/schemas/LightLevel'
        b:
          $ref: '#/components/schemas/LightLevel'
      description: 環境光の色。明るさは daylight が持ち、ここは色味だけを表す
    Ammo:
      type: object
      required:
        - damageBonus
        - accuracyBonus
      properties:
        ammoTag:
          $ref: '#/components/schemas/AmmoTag'
        damageBonus:
          $ref: '#/components/schemas/DamageBonus'
        accuracyBonus:
          $ref: '#/components/schemas/AccuracyBonus'
      description: 弾薬設定
    AmmoTag:
      type: string
      enum:
        - 9mm
        - rifle
        - shell
        - energy_cell
      description: 弾薬タグ
    ArmorDefense:
      type: integer
      minimum: 0
      maximum: 999
      description: 防具の防御力
    AttackCategory:
      type: string
      enum:
        - fist
        - sword
        - spear
        - handgun
        - rifle
        - cannon
        - bow
    AttackCount:
      type: integer
      minimum: 1
      maximum: 10
      description: 1ターンあたりの攻撃回数
    AttackRange:
      type: string
      enum:
        - melee
        - ranged
      description: 攻撃種別。武器の攻撃種別は同じ名前の武器スキルで上達する攻撃の射程の区分
    AttackType:
      type: object
      required:
        - id
        - name
        - range
        - injury
        - skill
        - damage
        - accuracy
      properties:
        id:
          $ref: '#/components/schemas/AttackCategory'
        name:
          $ref: '#/components/schemas/EntityName'
        range:
          $ref: '#/components/schemas/AttackRange'
        optimalRange:
          allOf:
            - $ref: '#/components/schemas/RangeTiles'
          description: 遠距離だけが持つ。この距離までは命中が落ちない
        maxRange:
          allOf:
            - $ref: '#/components/schemas/RangeTiles'
          description: 遠距離だけが持つ。この距離を超えると撃てない
        penaltyPerTile:
          allOf:
            - $ref: '#/components/schemas/RangePenaltyPercent'
          description: 遠距離だけが持つ。最適射程を1タイル超えるごとに下がる命中。百分率
        injury:
          $ref: '#/components/schemas/ConditionTypeName'
        skill:
          allOf:
            - $ref: '#/components/schemas/SkillId'
          description: 攻撃で上達するスキル
        damage:
          allOf:
            - $ref: '#/components/schemas/ProficiencyId'
          description: ダメージを決める熟練の効果倍率。skill の行が持つ
        accuracy:
          allOf:
            - $ref: '#/components/schemas/ProficiencyId'
          description: 命中を決める熟練の効果倍率。skill の行が持つ
      description: 攻撃種別。射程などの計算は Go が持ち、raw は命中で負わせる怪我を持つ
    Balance.AbilityScore:
      type: integer
      description: 能力値。プレイヤーのステータス
    Balance.Accuracy:
      type: integer
      minimum: 0
      maximum: 100
      description: 命中率。0-100
    Balance.BattleMetric:
      type: object
      required:
        - player
        - weapon
        - enemy
        - dps
        - isRanged
      properties:
        player:
          $ref: '#/components/schemas/Balance.CombatantName'
        weapon:
          $ref: '#/components/schemas/Balance.WeaponName'
        enemy:
          $ref: '#/components/schemas/Balance.CombatantName'
        dps:
          $ref: '#/components/schemas/Balance.DPS'
        isRanged:
          $ref: '#/components/schemas/Balance.RangedFlag'
      description: 武器×敵の戦闘シミュレーション結果
    Balance.CombatantName:
      type: string
      description: 戦闘員名。プレイヤーや敵の raw id を指す
    Balance.DPS:
      type: number
      format: double
      minimum: 0
      description: 1秒あたりの推定ダメージ
    Balance.Damage:
      type: integer
      minimum: 0
      description: ダメージ量
    Balance.DeathFlag:
      type: boolean
      description: 死亡したかどうか
    Balance.Depth:
      type: integer
      minimum: 0
      description: 深度。地上を1とする階層
    Balance.DepthStat:
      type: object
      required:
        - depth
        - medianHP
        - p5HP
        - p95HP
        - medianHPBeforeHeal
        - p5HPBeforeHeal
        - p95HPBeforeHeal
        - suddenDeathRate
        - medianWeaponDamage
        - p5WeaponDamage
        - p95WeaponDamage
        - medianKillTurns
        - p5KillTurns
        - p95KillTurns
        - medianHunger
        - p5Hunger
        - p95Hunger
        - medianDamage
        - medianHealing
      properties:
        depth:
          $ref: '#/components/schemas/Balance.Depth'
        medianHP:
          $ref: '#/components/schemas/Balance.HP'
        p5HP:
          $ref: '#/components/schemas/Balance.HP'
        p95HP:
          $ref: '#/components/schemas/Balance.HP'
        medianHPBeforeHeal:
          $ref: '#/components/schemas/Balance.HP'
        p5HPBeforeHeal:
          $ref: '#/components/schemas/Balance.HP'
        p95HPBeforeHeal:
          $ref: '#/components/schemas/Balance.HP'
        suddenDeathRate:
          $ref: '#/components/schemas/Balance.Rate'
        medianWeaponDamage:
          $ref: '#/components/schemas/Balance.Damage'
        p5WeaponDamage:
          $ref: '#/components/schemas/Balance.Damage'
        p95WeaponDamage:
          $ref: '#/components/schemas/Balance.Damage'
        medianKillTurns:
          $ref: '#/components/schemas/Balance.KillTurns'
        p5KillTurns:
          $ref: '#/components/schemas/Balance.KillTurns'
        p95KillTurns:
          $ref: '#/components/schemas/Balance.KillTurns'
        medianHunger:
          $ref: '#/components/schemas/Balance.Hunger'
        p5Hunger:
          $ref: '#/components/schemas/Balance.Hunger'
        p95Hunger:
          $ref: '#/components/schemas/Balance.Hunger'
        medianDamage:
          $ref: '#/components/schemas/Balance.Damage'
        medianHealing:
          $ref: '#/components/schemas/Balance.Healing'
      description: 1深度の統計情報
    Balance.EnemyTableName:
      type: string
      description: 敵テーブル名
    Balance.EnemyTableRun:
      type: object
      required:
        - name
        - maxDepth
        - trials
        - medianDepth
        - deathRate
        - depths
        - trialData
      properties:
        name:
          $ref: '#/components/schemas/Balance.EnemyTableName'
        maxDepth:
          $ref: '#/components/schemas/Balance.Depth'
        trials:
          $ref: '#/components/schemas/Balance.TrialCount'
        medianDepth:
          $ref: '#/components/schemas/Balance.Depth'
        deathRate:
          $ref: '#/components/schemas/Balance.Rate'
        depths:
          type: array
          items:
            $ref: '#/components/schemas/Balance.DepthStat'
          description: 深度ごとの統計
        trialData:
          type: array
          items:
            $ref: '#/components/schemas/Balance.TrialResult'
          description: 試行ごとの生データ
      description: 1つの敵テーブルに対するシミュレーション結果
    Balance.ExpectedCount:
      type: number
      format: double
      minimum: 0
      description: 期待個数
    Balance.FacilityId:
      type: string
      description: 施設種別 id
    Balance.FacilityLoot:
      type: object
      required:
        - facility
        - trials
        - rooms
      properties:
        facility:
          $ref: '#/components/schemas/Balance.FacilityId'
        trials:
          $ref: '#/components/schemas/Balance.TrialCount'
        rooms:
          type: array
          items:
            $ref: '#/components/schemas/Balance.RoomLoot'
          description: 部屋役割ごとの loot
      description: 1施設種別の loot 分布
    Balance.HP:
      type: integer
      description: HP 値。最大値や統計値を表す。計算値は負になりうるので無制約にする
    Balance.Healing:
      type: integer
      minimum: 0
      description: 回復量
    Balance.Hunger:
      type: integer
      description: 空腹度
    Balance.ItemName:
      type: string
      description: アイテム名。loot アイテムの raw id を指す
    Balance.ItemValue:
      type: integer
      minimum: 0
      description: アイテムの売買価値
    Balance.KillTurns:
      type: integer
      minimum: 0
      description: 撃破に要するターン数
    Balance.LootItemStat:
      type: object
      required:
        - name
        - prob
        - expectedCount
        - value
      properties:
        name:
          $ref: '#/components/schemas/Balance.ItemName'
        prob:
          allOf:
            - $ref: '#/components/schemas/Balance.Rate'
          description: 1棟あたり1個以上出る確率
        expectedCount:
          allOf:
            - $ref: '#/components/schemas/Balance.ExpectedCount'
          description: 1棟あたりの期待個数
        value:
          allOf:
            - $ref: '#/components/schemas/Balance.ItemValue'
          description: 売買価値
      description: 1アイテムの loot 統計
    Balance.PlayerInfo:
      type: object
      required:
        - name
        - hp
        - strength
        - sensation
        - dexterity
        - agility
        - defense
      properties:
        name:
          $ref: '#/components/schemas/Balance.CombatantName'
        hp:
          $ref: '#/components/schemas/Balance.HP'
        strength:
          $ref: '#/components/schemas/Balance.AbilityScore'
        sensation:
          $ref: '#/components/schemas/Balance.AbilityScore'
        dexterity:
          $ref: '#/components/schemas/Balance.AbilityScore'
        agility:
          $ref: '#/components/schemas/Balance.AbilityScore'
        defense:
          $ref: '#/components/schemas/Balance.AbilityScore'
      description: プレイヤーのステータス情報
    Balance.RangedFlag:
      type: boolean
      description: 遠距離武器かどうか
    Balance.Rate:
      type: number
      format: double
      minimum: 0
      maximum: 1
      description: 割合。0.0-1.0
    Balance.Report:
      type: object
      required:
        - mode
        - enemyTables
        - battleMetrics
        - roomLoot
      properties:
        mode:
          allOf:
            - $ref: '#/components/schemas/Balance.ReportMode'
          description: レポートの種別
        player:
          allOf:
            - $ref: '#/components/schemas/Balance.PlayerInfo'
          description: プレイヤーのステータス。生成しないモードでは省く
        weapon:
          allOf:
            - $ref: '#/components/schemas/Balance.WeaponInfo'
          description: 武器の情報。生成しないモードでは省く
        enemyTables:
          type: array
          items:
            $ref: '#/components/schemas/Balance.EnemyTableRun'
          description: 敵テーブルごとのシミュレーション結果
        battleMetrics:
          type: array
          items:
            $ref: '#/components/schemas/Balance.BattleMetric'
          description: 武器×敵の戦闘メトリクス
        roomLoot:
          type: array
          items:
            $ref: '#/components/schemas/Balance.FacilityLoot'
          description: 施設種別ごとの loot 分布
      description: balance.json の最上位構造。シミュレーション結果全体を表す
    Balance.ReportMode:
      type: string
      description: レポートの種別
    Balance.RoomLoot:
      type: object
      required:
        - role
        - items
      properties:
