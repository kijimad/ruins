<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head><body>
<script type="importmap">
{
  "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" },
  "integrity": { "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js": "sha384-GY5FqjttLCFRt/McQbyaVdCk2O1IQtOeX8Py6NfD89BIAsIyJFRl4UgSXrk2vXAk" }
}
</script>
<script type="module">
// タイトル画面の凍った惑星。星空に惑星の弧を大きく置き、太陽の側だけを照らして縁に薄い大気の光を付ける。
// 惑星は画面の下へ大きくはみ出させ、左上の宇宙にロゴ、右下の夜の側にメニューが載る構図にする
import * as THREE from 'three';

const q = new URLSearchParams(location.search);
const W = +(q.get('w') || 960), H = +(q.get('h') || 720);
// 空と惑星は別の乱数で作る。空の seed を変えて見比べても、惑星の形は変わらない
const rng = (s0) => { let s = s0 | 0; return (a = 0, b = 1) => { s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return a + (b - a) * (((t ^ t >>> 14) >>> 0) / 4294967296); }; };
const SKY = +(q.get('sky') || 1);
const S = rng(SKY * 7919 + 13);
const R = rng(+(q.get('planet') || 1));

const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();

// 天の川の帯の向き。帯は空を一周する大きな円で、その円の軸を決める
const bandN = new THREE.Vector3(S(-1, 1), S(-1, 1), S(-1, 1)).normalize();

// 空。遠くの球の裏面に、方向から求めたノイズで星雲と天の川を描く
const sky = new THREE.Mesh(new THREE.SphereGeometry(1500, 64, 48), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: { uSeed: { value: S(0, 100) }, uBand: { value: bandN } },
  vertexShader: 'varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: `
    varying vec3 vDir; uniform float uSeed; uniform vec3 uBand;
    float h(vec3 p){ p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
    float n(vec3 x){ vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
      return mix(mix(mix(h(i), h(i + vec3(1,0,0)), f.x), mix(h(i + vec3(0,1,0)), h(i + vec3(1,1,0)), f.x), f.y),
                 mix(mix(h(i + vec3(0,0,1)), h(i + vec3(1,0,1)), f.x), mix(h(i + vec3(0,1,1)), h(i + vec3(1,1,1)), f.x), f.y), f.z); }
    float fbm(vec3 p){ float v = 0.0, a = 0.5; for (int i = 0; i < 6; i++){ v += a * n(p); p *= 2.03; a *= 0.5; } return v; }
    void main(){
      vec3 d = normalize(vDir);
      float band = exp(-pow(dot(d, uBand) / 0.22, 2.0));
      float a = fbm(d * 2.2 + uSeed);
      float b = fbm(d * 4.5 + uSeed * 1.7 + 3.0);
      vec3 col = vec3(0.010, 0.014, 0.035);
      vec3 neb = mix(mix(vec3(0.04, 0.14, 0.28), vec3(0.10, 0.22, 0.34), smoothstep(0.3, 0.6, b)), vec3(0.28, 0.12, 0.34), smoothstep(0.55, 0.8, b));
      col += neb * smoothstep(0.42, 0.85, a) * 1.6;
      col += vec3(0.16, 0.18, 0.26) * band * smoothstep(0.3, 0.75, b) * 1.4;
      gl_FragColor = vec4(col, 1.0);
    }`,
}));
// 空は背景なので、ほかの物より先に描く
sky.renderOrder = -1;
scene.add(sky);

// 星。どれもピクセル絵の1画素の点にし、明るさで大小を出す。暗い星を多く明るい星を少なくし、天の川の近くほど密にする。ほとんどは青白く、いくつかを暖色にする
{
  const pos = [], col = [];
  for (let i = 0; i < 20000 && pos.length < 2600 * 3; i++) {
    const u = S(-1, 1), a = S(0, Math.PI * 2), r = Math.sqrt(1 - u * u);
    const d = new THREE.Vector3(Math.cos(a) * r, u, Math.sin(a) * r);
    const band = Math.exp(-((d.dot(bandN) / 0.22) ** 2));
    if (S() > 0.25 + band * 0.75) continue;
    const b = S() ** 3;
    const warm = S() < 0.12;
    const c = warm ? [1, 0.82, 0.62] : [0.78, 0.86, 1];
    const lv = 0.25 + b * 0.75;
    pos.push(d.x * 1400, d.y * 1400, d.z * 1400);
    col.push(c[0] * lv, c[1] * lv, c[2] * lv);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ size: 1, sizeAttenuation: false, vertexColors: true })));
}

// 惑星。面を荒く分けた球の頂点を、重ねた波で凹凸にする。高い所は雪の白、低い所は氷の青にする
const RAD = 100;
{
  const g = new THREE.IcosahedronGeometry(RAD, 24);
  const p = g.attributes.position;
  const waves = Array.from({ length: 7 }, () => ({ d: new THREE.Vector3(R(-1, 1), R(-1, 1), R(-1, 1)).normalize(), f: R(2, 9), ph: R(0, 6), a: R(0.4, 1) }));
  const colors = [];
  const ice = new THREE.Color('#3f6ea8'), snow = new THREE.Color('#e8eef8'), crack = new THREE.Color('#9fc2e6');
  const v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i).normalize();
    let h = 0;
    for (const w of waves) h += Math.sin(v.dot(w.d) * w.f + w.ph) * w.a;
    h /= waves.length;
    v.multiplyScalar(RAD * (1 + h * 0.025));
    p.setXYZ(i, v.x, v.y, v.z);
    const c = h > 0.08 ? snow.clone() : h > -0.05 ? crack.clone() : ice.clone();
    colors.push(c.r, c.g, c.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  g.computeVertexNormals();
  const planet = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.9 }));
  planet.rotation.set(0.3, 0.8, 0.1);
  scene.add(planet);

  // 大気の縁。少し大きい球の裏面を、縁ほど濃い青で加算する
  const atmo = new THREE.Mesh(new THREE.SphereGeometry(RAD * 1.035, 64, 48), new THREE.ShaderMaterial({
    side: THREE.BackSide, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
    vertexShader: 'varying vec3 n; varying vec3 vp; void main(){ n = normalize(normalMatrix * normal); vec4 mv = modelViewMatrix * vec4(position,1.0); vp = mv.xyz; gl_Position = projectionMatrix * mv; }',
    fragmentShader: 'varying vec3 n; varying vec3 vp; void main(){ float f = pow(1.0 - abs(dot(normalize(-vp), n)), 3.0); gl_FragColor = vec4(vec3(0.45,0.7,1.0) * f * 1.4, f); }',
  }));
  scene.add(atmo);
}

// 太陽は左の奥から当て、惑星の左の縁を明るく、右を夜にする
const sun = new THREE.DirectionalLight('#fff4e6', 3.4);
sun.position.set(-1.4, 0.5, -0.5);
scene.add(sun);
scene.add(new THREE.AmbientLight('#1a2a4a', 0.35));

// 惑星の上の縁が画面の中ほどを横切るよう、下から見上げる位置に置く
const cam = new THREE.PerspectiveCamera(35, W / H, 1, 3000);
cam.position.set(0, 60, 230);
cam.lookAt(0, 128, 0);
renderer.render(scene, cam);
</script>
</body></html>
